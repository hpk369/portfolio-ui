<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="1280" height="720"></canvas>
<script>
const gl = document.getElementById('c').getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs = `precision highp float;
uniform vec2 R; uniform float T; // T in [0,1): loop phase
#define TAU 6.2831853
float h1(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdRBox(vec3 p, vec3 b, float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float sdOct(vec3 p,float s){p=abs(p);return (p.x+p.y+p.z-s)*0.57735027;}
const float C = 2.4;
float piece(vec3 p, vec3 id){
  float a=h1(id), b=h1(id+7.3), c=h1(id+3.1);
  if (a < 0.55) return 1e3; // caller clamps                          // leave some cells empty
  float spin = TAU*T*(b<0.5?1.:-1.);               // one full turn per loop, so it loops
  p.xz *= rot(b*TAU + spin);
  p.xy *= rot(c*TAU + spin);
  vec3 o = (vec3(h1(id+1.),h1(id+2.),h1(id+4.))-0.5)*0.8;
  p -= o;
  if (c < 0.35) return sdOct(p, 0.55);
  vec3 sz = mix(vec3(0.18,0.32,0.5), vec3(0.5,0.22,0.36), vec3(a,b,c));
  return sdRBox(p, sz, 0.06);
}
float map(vec3 p){
  vec3 id = floor(p/C);
  vec3 q = mod(p, C) - 0.5*C;
  vec3 aq = abs(q);
  float edge = 0.5*C - max(aq.x, max(aq.y, aq.z)) + 0.02; // safe step across an empty cell
  if (id.x == 0. && id.y == 0.) return edge;                // keep the camera's corridor clear
  return min(piece(q, id), edge + 0.05);
}
vec3 nrm(vec3 p){vec2 e=vec2(0.002,0.);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
float ao(vec3 p, vec3 n){float o=0.,s=1.;for(int i=1;i<5;i++){float h=0.06*float(i);o+=(h-map(p+n*h))*s;s*=0.6;}return clamp(1.-2.5*o,0.,1.);}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*R)/R.y;
  vec3 ro=vec3(0.3*C, 0.5*C, -T*C*3.);             // travel exactly 3 cells per loop
  vec3 rd=normalize(vec3(uv, -1.25));
  rd.xy *= rot(0.18*sin(TAU*T));
  rd.yz *= rot(-0.12);
  float t=0.; float d; bool hit=false;
  for(int i=0;i<140;i++){ d=map(ro+rd*t); if(d<0.001){hit=true;break;} t+=d*0.7; if(t>22.) break; }
  vec3 col=vec3(0.);
  if(hit){
    vec3 p=ro+rd*t, n=nrm(p);
    vec3 L=normalize(vec3(-0.5,0.8,0.4));
    float dif=max(dot(n,L),0.), sky=0.5+0.5*n.y;
    float rim=pow(1.-max(dot(n,-rd),0.),3.);
    float spec=pow(max(dot(reflect(rd,n),L),0.),24.);
    float occ=ao(p,n);
    col = vec3(1.0)*pow(dif,1.4)*occ + vec3(0.05)*sky*occ + vec3(1.,0.12,0.)*rim*0.55 + spec*0.35;
    col *= exp(-0.16*t);
  }
  col = pow(col, vec3(0.4545));
  gl_FragColor=vec4(col,1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(o);return o;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),1280,720);
const uT=gl.getUniformLocation(pr,'T');
window.draw=(t)=>{gl.uniform1f(uT,t);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();};
</script></body></html>
